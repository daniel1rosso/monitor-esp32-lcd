services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    command: [air, -c, .air.toml]
    volumes:
      - ./backend:/src
      - ./contracts/config/platform.example.yaml:/config/platform.yaml:ro
      - backend_go_cache:/go/pkg/mod
    read_only: false

  frontend:
    image: node:20.19.0-alpine
    build: null
    working_dir: /app
    command: [npm, run, dev, --, --host, 0.0.0.0, --port, "8080"]
    environment:
      VITE_API_URL: http://localhost:9096/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    read_only: false
    tmpfs: []

volumes:
  backend_go_cache:
  frontend_node_modules:
