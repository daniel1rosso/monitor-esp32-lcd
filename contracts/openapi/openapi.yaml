openapi: 3.1.0
info:
  title: Desk Monitor Platform API
  version: 1.0.0
  description: Contract-first API for the administration console, devices and event producers.
servers:
  - url: /api/v1
tags:
  - name: System
  - name: Auth
  - name: Device
  - name: Products
  - name: Services
  - name: Alerts
  - name: Deployments
  - name: Markets
  - name: Weather
  - name: Devices
  - name: Profiles
  - name: Settings
  - name: Events
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Minimal public platform status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicHealth'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /health/live:
    get:
      tags: [System]
      operationId: getLiveness
      security: []
      x-internal: true
      responses:
        '200':
          description: Process and event loop are alive. Internal listener only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PublicHealth'}
  /health/ready:
    get:
      tags: [System]
      operationId: getReadiness
      security: []
      x-internal: true
      responses:
        '200':
          description: Required dependencies are ready. Internal listener only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Health'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /version:
    get:
      tags: [System]
      operationId: getVersion
      security: []
      responses:
        '200':
          description: Build information.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Version'}
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LoginRequest'}
      responses:
        '200':
          description: Access token; refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessTokenResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Rotated session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccessTokenResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - userBearer: []
      responses:
        '204': {description: Session revoked.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      security:
        - userBearer: []
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /device/auth/token:
    post:
      tags: [Device]
      operationId: exchangeDeviceSecret
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceTokenRequest'}
      responses:
        '200':
          description: Short-lived device token and MQTT connection data.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceTokenResponse'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /device/dashboard:
    get:
      tags: [Device]
      operationId: getDeviceDashboard
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Authoritative screen snapshot.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '../json-schema/dashboard.schema.json'}
        '304': {description: Dashboard revision did not change.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /device/config:
    get:
      tags: [Device]
      operationId: getDeviceConfig
      security:
        - deviceBearer: []
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Effective device configuration.
          headers:
            ETag: {schema: {type: string}}
          content:
            application/json:
              schema: {$ref: '../json-schema/device-config.schema.json'}
        '304': {description: Configuration revision did not change.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /products:
    get:
      tags: [Products]
      operationId: listProducts
      security: [{userBearer: []}]
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Product page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Product'}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      tags: [Products]
      operationId: createProduct
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProductWrite'}
      responses:
        '201':
          description: Product created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /products/{productId}:
    parameters:
      - $ref: '#/components/parameters/ProductId'
    get:
      tags: [Products]
      operationId: getProduct
      security: [{userBearer: []}]
      responses:
        '200':
          description: Product detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Products]
      operationId: updateProduct
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/ProductWrite'}
      responses:
        '200':
          description: Product updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Product'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Products]
      operationId: archiveProduct
      security: [{userBearer: []}]
      responses:
        '204': {description: Product archived.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /services:
    get:
      tags: [Services]
      operationId: listServices
      security: [{userBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ProductFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Service page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Service'}}
    post:
      tags: [Services]
      operationId: createService
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ServiceCreate'}
      responses:
        '201':
          description: Service created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /services/{serviceId}:
    parameters:
      - $ref: '#/components/parameters/ServiceId'
    get:
      tags: [Services]
      operationId: getService
      security: [{userBearer: []}]
      responses:
        '200':
          description: Service detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Services]
      operationId: updateService
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/ServiceUpdate'}
      responses:
        '200':
          description: Service updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Service'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Services]
      operationId: archiveService
      security: [{userBearer: []}]
      responses:
        '204': {description: Service archived.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /alerts:
    get:
      tags: [Alerts]
      operationId: listAlerts
      security: [{userBearer: []}]
      parameters:
        - {name: state, in: query, schema: {$ref: '#/components/schemas/AlertState'}}
        - {name: priority, in: query, schema: {$ref: '#/components/schemas/Priority'}}
        - $ref: '#/components/parameters/ProductFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Alert page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Alert'}}
    post:
      tags: [Alerts]
      operationId: createManualAlert
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/AlertCreate'}
      responses:
        '201':
          description: Manual alert created and queued for publication.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /alerts/{alertId}/acknowledge:
    post:
      tags: [Alerts]
      operationId: acknowledgeAlert
      security: [{userBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Alert acknowledged idempotently.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /alerts/{alertId}/resolve:
    post:
      tags: [Alerts]
      operationId: resolveAlert
      security: [{userBearer: []}]
      parameters:
        - $ref: '#/components/parameters/AlertId'
      responses:
        '200':
          description: Alert resolved idempotently.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Alert'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /deployments:
    get:
      tags: [Deployments]
      operationId: listDeployments
      security: [{userBearer: []}]
      parameters:
        - $ref: '#/components/parameters/ProductFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Deployment page.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/Deployment'}}
  /markets/quotes:
    get:
      tags: [Markets]
      operationId: listMarketQuotes
      security: [{userBearer: []}]
      parameters:
        - {name: symbol, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Quote history.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    required: [items]
                    properties:
                      items: {type: array, items: {$ref: '#/components/schemas/MarketQuote'}}
  /weather:
    get:
      tags: [Weather]
      operationId: getWeather
      security: [{userBearer: []}]
      parameters:
        - {name: location, in: query, schema: {type: string, default: rio-cuarto}}
      responses:
        '200':
          description: Latest weather observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Weather'}
        '404': {$ref: '#/components/responses/NotFound'}
  /devices:
    get:
      tags: [Devices]
      operationId: listDevices
      security: [{userBearer: []}]
      responses:
        '200':
          description: Devices.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Device'}}
    post:
      tags: [Devices]
      operationId: createDevice
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeviceCreate'}
      responses:
        '201':
          description: Device and one-time credentials.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCreated'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /devices/{deviceId}/revoke:
    post:
      tags: [Devices]
      operationId: revokeDevice
      security: [{userBearer: []}]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '204': {description: REST and MQTT credentials revoked.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/DeviceId'
    get:
      tags: [Devices]
      operationId: getDevice
      security: [{userBearer: []}]
      responses:
        '200':
          description: Device detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      tags: [Devices]
      operationId: updateDevice
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/DeviceUpdate'}
      responses:
        '200':
          description: Device updated.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Device'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /devices/{deviceId}/rotate-credentials:
    post:
      tags: [Devices]
      operationId: rotateDeviceCredentials
      security: [{userBearer: []}]
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      responses:
        '200':
          description: Previous credentials revoked and one-time replacements returned.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeviceCredentials'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      security: [{userBearer: []}]
      responses:
        '200':
          description: Screen profiles.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/ScreenProfile'}}
    post:
      tags: [Profiles]
      operationId: createProfile
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScreenProfileWrite'}
      responses:
        '201':
          description: Profile created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScreenProfile'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /profiles/{profileId}:
    parameters:
      - $ref: '#/components/parameters/ProfileId'
    get:
      tags: [Profiles]
      operationId: getProfile
      security: [{userBearer: []}]
      responses:
        '200':
          description: Screen profile detail.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScreenProfile'}
        '404': {$ref: '#/components/responses/NotFound'}
    put:
      tags: [Profiles]
      operationId: replaceProfile
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ScreenProfileWrite'}
      responses:
        '200':
          description: Profile replaced and revision incremented.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ScreenProfile'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      tags: [Profiles]
      operationId: deleteProfile
      security: [{userBearer: []}]
      responses:
        '204': {description: Unassigned profile deleted.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /settings:
    get:
      tags: [Settings]
      operationId: listSettings
      security: [{userBearer: []}]
      responses:
        '200':
          description: Non-secret editable settings and their schemas.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Setting'}}
    patch:
      tags: [Settings]
      operationId: updateSettings
      security: [{userBearer: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Effective settings after validation.
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/Setting'}}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /collectors/{collectorName}/retry:
    post:
      tags: [Settings]
      operationId: retryCollector
      security: [{userBearer: []}]
      parameters:
        - name: collectorName
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 80}
      responses:
        '202': {description: Collection scheduled idempotently.}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /events/github:
    post:
      tags: [Events]
      operationId: receiveGitHubWebhook
      security: []
      parameters:
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string}}
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '202': {description: Valid delivery accepted or already processed.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /events/github/actions:
    post:
      tags: [Events]
      operationId: receiveGitHubAction
      security: [{githubActionsBearer: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GitHubActionEvent'}
      responses:
        '202': {description: Event accepted or already processed.}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /events/uptime:
    post:
      tags: [Events]
      operationId: receiveUptimeEvent
      security: [{uptimeBearer: []}]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UptimeEvent'}
      responses:
        '202': {description: Event accepted or already processed.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /stream:
    get:
      tags: [System]
      operationId: streamEvents
      security: [{userBearer: []}]
      responses:
        '200':
          description: SSE invalidation stream. Event data conforms to StreamEvent.
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
components:
  securitySchemes:
    userBearer: {type: http, scheme: bearer, bearerFormat: JWT}
    deviceBearer: {type: http, scheme: bearer, bearerFormat: JWT}
    githubActionsBearer: {type: http, scheme: bearer}
    uptimeBearer: {type: http, scheme: bearer}
    refreshCookie: {type: apiKey, in: cookie, name: desk_refresh}
  parameters:
    IfNoneMatch: {name: If-None-Match, in: header, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
    ProductFilter: {name: product_id, in: query, schema: {type: string}}
    ProductId: {name: productId, in: path, required: true, schema: {type: string}}
    ServiceId: {name: serviceId, in: path, required: true, schema: {type: string}}
    AlertId: {name: alertId, in: path, required: true, schema: {type: string}}
    DeviceId: {name: deviceId, in: path, required: true, schema: {type: string}}
    ProfileId: {name: profileId, in: path, required: true, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 8, maxLength: 128}}
  responses:
    BadRequest: {$ref: '#/components/responses/Problem400'}
    Problem400:
      description: Invalid request.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unauthorized:
      description: Missing or invalid credentials.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Forbidden:
      description: Authenticated actor lacks permission.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    NotFound:
      description: Resource not found.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Conflict:
      description: State or uniqueness conflict.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    RateLimited:
      description: Request rate exceeded.
      headers: {Retry-After: {schema: {type: integer}}}
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
    Unavailable:
      description: Required dependency unavailable.
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Problem:
      type: object
      required: [type, title, status, request_id]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        request_id: {type: string}
        errors: {type: object, additionalProperties: {type: array, items: {type: string}}}
    PublicHealth:
      type: object
      additionalProperties: false
      required: [status, checked_at]
      properties:
        status: {type: string, enum: [ok, degraded, unavailable]}
        checked_at: {type: string, format: date-time}
    Health:
      type: object
      required: [status, checked_at, dependencies]
      properties:
        status: {type: string, enum: [ok, degraded, unavailable]}
        checked_at: {type: string, format: date-time}
        dependencies:
          type: object
          additionalProperties: {$ref: '#/components/schemas/DependencyHealth'}
    DependencyHealth:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded, unavailable]}
        latency_ms: {type: integer, minimum: 0}
        detail: {type: string}
    Version:
      type: object
      required: [version, commit, built_at, api_version]
      properties:
        version: {type: string}
        commit: {type: string}
        built_at: {type: string, format: date-time}
        api_version: {type: string, const: v1}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, minLength: 8, maxLength: 1024}
    AccessTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, const: 900}
        user: {$ref: '#/components/schemas/User'}
    User:
      type: object
      required: [id, email, role, created_at]
      properties:
        id: {type: string}
        email: {type: string, format: email}
        role: {type: string, enum: [admin, viewer]}
        created_at: {type: string, format: date-time}
    DeviceTokenRequest:
      type: object
      additionalProperties: false
      required: [device_id, secret]
      properties:
        device_id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,63}$'}
        secret: {type: string, minLength: 32, maxLength: 256}
        firmware_version: {type: string, maxLength: 64}
    DeviceTokenResponse:
      type: object
      required: [access_token, token_type, expires_in, mqtt]
      properties:
        access_token: {type: string}
        token_type: {type: string, const: Bearer}
        expires_in: {type: integer, const: 900}
        mqtt:
          type: object
          required: [url, client_id, username]
          properties:
            url: {type: string, format: uri}
            client_id: {type: string}
            username: {type: string}
            password: {type: [string, 'null'], description: Returned only when rotated or initially provisioned.}
    Page:
      type: object
      required: [items, has_more]
      properties:
        items: {type: array, items: {}}
        next_cursor: {type: [string, 'null']}
        has_more: {type: boolean}
    ProductWrite:
      type: object
      additionalProperties: false
      properties:
        key: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        description: {type: string, maxLength: 500}
        enabled: {type: boolean}
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductWrite'
        - type: object
          required: [id, key, name, enabled, health, created_at, updated_at]
          properties:
            id: {type: string}
            health: {$ref: '#/components/schemas/ServiceState'}
            created_at: {type: string, format: date-time}
            updated_at: {type: string, format: date-time}
    Service:
      type: object
      required: [id, product_id, key, name, status, updated_at]
      properties:
        id: {type: string}
        product_id: {type: string}
        key: {type: string}
        name: {type: string}
        status: {$ref: '#/components/schemas/ServiceState'}
        latency_ms: {type: [integer, 'null'], minimum: 0}
        updated_at: {type: string, format: date-time}
    ServiceCreate:
      type: object
      additionalProperties: false
      required: [product_id, key, name]
      properties:
        product_id: {type: string}
        key: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, maxLength: 64}
        endpoint: {type: [string, 'null'], format: uri}
        enabled: {type: boolean, default: true}
    ServiceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {type: string, maxLength: 64}
        endpoint: {type: [string, 'null'], format: uri}
        enabled: {type: boolean}
    ServiceState: {type: string, enum: [operational, degraded, outage, maintenance, unknown]}
    Priority: {type: string, enum: [critical, warning, info, success]}
    AlertState: {type: string, enum: [open, acknowledged, resolved]}
    Alert:
      type: object
      required: [id, fingerprint, priority, state, title, message, opened_at, updated_at]
      properties:
        id: {type: string}
        product_id: {type: [string, 'null']}
        service_id: {type: [string, 'null']}
        fingerprint: {type: string}
        priority: {$ref: '#/components/schemas/Priority'}
        state: {$ref: '#/components/schemas/AlertState'}
        title: {type: string}
        message: {type: string}
        opened_at: {type: string, format: date-time}
        acknowledged_at: {type: [string, 'null'], format: date-time}
        resolved_at: {type: [string, 'null'], format: date-time}
        updated_at: {type: string, format: date-time}
    AlertCreate:
      type: object
      additionalProperties: false
      required: [fingerprint, priority, title, message]
      properties:
        product_id: {type: [string, 'null']}
        service_id: {type: [string, 'null']}
        fingerprint: {type: string, minLength: 1, maxLength: 160}
        priority: {$ref: '#/components/schemas/Priority'}
        title: {type: string, minLength: 1, maxLength: 48}
        message: {type: string, minLength: 1, maxLength: 160}
        expires_at: {type: [string, 'null'], format: date-time}
    Deployment:
      type: object
      required: [id, repository, branch, workflow, status, commit_sha, author, started_at]
      properties:
        id: {type: string}
        product_id: {type: [string, 'null']}
        repository: {type: string}
        branch: {type: string}
        workflow: {type: string}
        status: {type: string, enum: [queued, in_progress, success, failure, cancelled]}
        commit_sha: {type: string}
        commit_message: {type: string}
        author: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: [string, 'null'], format: date-time}
        html_url: {type: [string, 'null'], format: uri}
    MarketQuote:
      type: object
      required: [provider, symbol, quote_asset, last, change_percent, observed_at]
      properties:
        provider: {type: string}
        symbol: {type: string}
        quote_asset: {type: string}
        bid: {type: [number, 'null']}
        ask: {type: [number, 'null']}
        last: {type: number}
        change_percent: {type: number}
        observed_at: {type: string, format: date-time}
        stale: {type: boolean, default: false}
    Weather:
      type: object
      required: [location, temperature_c, apparent_temperature_c, weather_code, observed_at]
      properties:
        location: {type: string}
        temperature_c: {type: number}
        apparent_temperature_c: {type: number}
        humidity_percent: {type: number, minimum: 0, maximum: 100}
        weather_code: {type: integer}
        wind_kmh: {type: number, minimum: 0}
        daily_min_c: {type: number}
        daily_max_c: {type: number}
        precipitation_probability_percent: {type: number, minimum: 0, maximum: 100}
        observed_at: {type: string, format: date-time}
        stale: {type: boolean, default: false}
    DeviceCreate:
      type: object
      additionalProperties: false
      required: [device_id, name, profile_id]
      properties:
        device_id: {type: string, pattern: '^[a-z0-9][a-z0-9-]{2,63}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        profile_id: {type: string}
    Device:
      type: object
      required: [id, device_id, name, profile_id, state, created_at]
      properties:
        id: {type: string}
        device_id: {type: string}
        name: {type: string}
        profile_id: {type: string}
        state: {type: string, enum: [online, offline, disabled, revoked]}
        firmware_version: {type: [string, 'null']}
        last_seen_at: {type: [string, 'null'], format: date-time}
        created_at: {type: string, format: date-time}
    DeviceUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        profile_id: {type: string}
        state: {type: string, enum: [offline, disabled]}
        overrides: {type: object, additionalProperties: true}
    DeviceCredentials:
      type: object
      additionalProperties: false
      required: [device_secret, mqtt_username, mqtt_password]
      properties:
        device_secret: {type: string, description: One-time value.}
        mqtt_username: {type: string}
        mqtt_password: {type: string, description: One-time value.}
    DeviceCreated:
      type: object
      required: [device, device_secret, mqtt_username, mqtt_password]
      properties:
        device: {$ref: '#/components/schemas/Device'}
        device_secret: {type: string, description: One-time value.}
        mqtt_username: {type: string}
        mqtt_password: {type: string, description: One-time value.}
    ProfileScreen:
      type: object
      required: [id, type, priority, duration_ms, enabled, config]
      properties:
        id: {type: string}
        type: {type: string, enum: [overview, product_status, service_status, alert, deployment, market, weather, metric_list, message]}
        priority: {type: integer, minimum: 0, maximum: 100}
        duration_ms: {type: integer, minimum: 3000, maximum: 60000}
        enabled: {type: boolean}
        config: {type: object, additionalProperties: true}
    ScreenProfileWrite:
      type: object
      additionalProperties: false
      required: [key, name, screens]
      properties:
        key: {type: string, pattern: '^[a-z0-9][a-z0-9-]{1,62}$'}
        name: {type: string, minLength: 1, maxLength: 100}
        screens: {type: array, maxItems: 12, items: {$ref: '#/components/schemas/ProfileScreen'}}
    ScreenProfile:
      allOf:
        - $ref: '#/components/schemas/ScreenProfileWrite'
        - type: object
          required: [id, revision]
          properties:
            id: {type: string}
            revision: {type: integer, minimum: 1}
    Setting:
      type: object
      required: [namespace, key, value, value_type, revision, editable]
      properties:
        namespace: {type: string}
        key: {type: string}
        value: {}
        value_type: {type: string, enum: [string, integer, number, boolean, duration, object]}
        revision: {type: integer, minimum: 1}
        editable: {type: boolean}
    GitHubActionEvent:
      type: object
      additionalProperties: false
      required: [repository, branch, workflow, status, commit_sha, author, occurred_at]
      properties:
        product_key: {type: string}
        repository: {type: string}
        branch: {type: string}
        workflow: {type: string}
        status: {type: string, enum: [queued, in_progress, success, failure, cancelled]}
        commit_sha: {type: string}
        commit_message: {type: string}
        author: {type: string}
        occurred_at: {type: string, format: date-time}
        html_url: {type: string, format: uri}
    UptimeEvent:
      type: object
      required: [monitor, heartbeat, msg]
      properties:
        monitor:
          type: [object, 'null']
          required: [id, name]
          properties:
            id: {type: [integer, string]}
            name: {type: string}
            url: {type: [string, 'null']}
        heartbeat:
          type: [object, 'null']
          required: [status, time]
          properties:
            status: {type: integer, enum: [0, 1]}
            time: {type: string}
            ping: {type: [number, 'null']}
            msg: {type: [string, 'null']}
        msg: {type: string}
    StreamEvent:
      type: object
      required: [id, type, occurred_at, resource]
      properties:
        id: {type: string}
        type: {type: string, enum: [created, updated, deleted, invalidated]}
        occurred_at: {type: string, format: date-time}
        resource: {type: string, enum: [dashboard, product, service, alert, deployment, market, weather, device, profile, setting]}
        resource_id: {type: [string, 'null']}
